prototype_status: "workflow_prototype_not_publication_model"
cdte:
  phase: "zinc blende"
  space_group: "F-43m (No. 216)"
  surface_orientation: "(111), Te-terminated top surface"
  source:
    database: "Materials Project / AFLOW crystallographic prototype"
    identifier: "mp-406; AFLOW AB_cF8_216_a_c-001"
    formula: "CdTe"
    url: "https://materialsproject.org/materials/mp-406/"
    aflow_url: "https://aflow.org/p/AB_cF8_216_a_c-001"
  starting_lattice_constant_angstrom: 6.48
cu_te:
  representative_phase: "stoichiometric Cu2Te Ch prototype"
  space_group: "P6/mmm (No. 191)"
  surface_orientation: "(001)"
  source:
    database: "AFLOW Encyclopedia of Crystallographic Prototypes"
    identifier: "A2B_hP6_191_h_e-001; ICSD 655706"
    formula: "Cu2Te"
    url: "https://aflow.org/p/A2B_hP6_191_h_e-001"
    original_reference: "H. Nowotny, Z. Metallkd. 37, 40-42 (1946)"
  aflow_parameters: {a_angstrom: 4.237, c_over_a: 1.71041, z_te: 0.306, z_cu: 0.16}
  x_temporarily_set_to: 0
  warning: "The experimental x, phase and orientation are unknown; this Cu2Te phase is only a verified representative prototype."
  thickness_definition: "integer repeats of the complete crystallographic c unit; no half-sheet slicing"
  planes_per_complete_c_repeat: 4
  full_repeat_plane_sequence: "Cu-Te-Te-Cu"
  interface_first_contact_element: "Cu"
  top_termination_for_H1_and_H2: "Cu"
matching:
  cdte_surface_cells: 13
  cu2te_surface_cells: 16
  method: "hexagonal coincidence cells: CdTe [[3,1],[-1,4]] versus Cu2Te 4x4"
  lattice_mismatch_percent: 2.56
  applied_strain: "biaxial compression is applied to Cu2Te; CdTe is kept at its starting lattice"
vacuum:
  total_angstrom: 18.0
  distribution: "9 A below and 9 A above the atoms"
constraints:
  fixed_layers: "bottom two CdTe atomic planes"
prototype_limitations:
  - "The CdTe(111) slab is polar and only three bilayers thick."
  - "Only one termination and one initial lateral registry are used."
  - "No Cu vacancies, Au electrode, ligands, grain boundaries or finite-temperature annealing are modeled."
  - "No energy or performance conclusion is valid until convergence and alternative-interface tests are completed."
  - "B0/H1/H2 replace the earlier T0/T1/T2 half-sheet thickness definition; T0/T1/T2 remain only as legacy files for traceability."
cp2k_smoke_test:
  implementation: "official cp2k/cp2k:2024.3 Docker image or a native CP2K executable"
  method: "PBE, Gamma point, Fermi-Dirac smearing"
  basis_file: "BASIS_MOLOPT"
  potential_file: "GTH_POTENTIALS"
  basis_and_potential_aliases:
    Cu: "DZVP-MOLOPT-SR-GTH-q11 / GTH-PBE-q11"
    Cd: "DZVP-MOLOPT-SR-GTH-q12 / GTH-PBE-q12"
    Te: "DZVP-MOLOPT-SR-GTH-q6 / GTH-PBE-q6"
  warning: "These are low-cost smoke-test settings, not a basis/cutoff/k-point convergence study."
coverage_prototype:
  model_ids: [C0, C50, C100]
  definition: "0, 8/16 and 16/16 complete lateral Cu4Te2 source cells retained above the same CdTe substrate"
  C50_morphology: "periodic half-area stripe, continuous along lateral cell vector B and repeated along A"
  invariant_geometry: "one complete Cu2Te c repeat, same initial interface gap, strain, Cu contact layer and Cu top termination as C100"
  warning: "Coverage is a geometric prototype and is not inferred from experimental morphology."
cp2k_research_lite:
  purpose: "starting inputs for relative electronic-structure trends, not a converged publication protocol"
  canonical_result_mapping: "C0 reuses B0; C100 reuses H1; no duplicate C0/B0 or C100/H1 calculation task"
  default_kpoint_mode: "implicit Gamma so CP2K 2024.3 can print PDOS/LDOS"
  optional_bulk_kpoint_check: "2x2x2; not run, so the current bulk Gamma energy is only a reference test value"
  optional_slab_kpoint_check: "2x2x1; not run"
  explicit_kpoint_output_limit: "CP2K 2024.3 PDOS/LDOS is disabled when an explicit KPOINTS section is active"
  dos_near_ef_window: "0.20 eV rectangular window; report raw total DOS plus substrate-area and Cu2Te-formula-unit normalized proxies"
  polar_slab_warning: "Absolute Fermi alignment/work function and barrier values are not reliable for the current thin polar CdTe(111) slab."
