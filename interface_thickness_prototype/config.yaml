project_name: CdTe_Cu2Te_interface_thickness_prototype
active_model_ids: [B0, H1, H2]
legacy_model_ids: [T0, T1, T2]
cdte:
  lattice_a_angstrom: 6.48
  miller_index: [1, 1, 1]
  bilayers: 3
  lateral_supercell: [[3, 1], [-1, 4]]
cu2te:
  miller_index: [0, 0, 1]
  lateral_supercell: [[4, 0], [0, 4]]
  bulk_c_angstrom: 7.24700717
  repeat_counts: {B0: 0, H1: 1, H2: 2}
interface:
  initial_gap_angstrom: 2.60
  lateral_shift_fractional: [0.0, 0.0]
vacuum:
  bottom_angstrom: 9.0
  top_angstrom: 9.0
  minimum_total_angstrom: 18.0
constraints:
  fixed_bottom_cdte_atomic_planes: 2
validation:
  z_layer_tolerance_angstrom: 0.20
  minimum_distance_angstrom: 1.80
  maximum_warning_mismatch_percent: 3.0
cp2k:
  basis_file: BASIS_MOLOPT
  potential_file: GTH_POTENTIALS
  cutoff_ry: 400
  rel_cutoff_ry: 60
  eps_scf: 1.0e-6
  max_scf: 80
  added_mos: 50
  electronic_temperature_k: 500
  geo_opt_test_max_iter: 5
  local_max_threads: 4
  slurm_cpus: 8
  slurm_time: "02:00:00"
  docker_image: "cp2k/cp2k:2024.3"
  basis_profile: "smoke_dzvp"
  optional_production_basis_profile: "tzvp_ucl_not_generated_by_default"
smoke_tests:
  ordered_calculation_ids:
    - 01_cdte_bulk_sp
    - 02_cu2te_bulk_sp
    - 03_b0_slab_sp
    - 04_h1_interface_sp
    - 05_h1_short_geo_opt
